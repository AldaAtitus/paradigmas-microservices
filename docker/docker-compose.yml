services:
  # ============================================
  # CONSUL
  # ============================================
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0 -ui
    networks:
      - backend
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # CARREGAMENTO DAS CONFIGURACOES
  # ============================================
  consul-config:
    image: hashicorp/consul:1.21
    container_name: consul-config
    entrypoint: ["/bin/sh", "/scripts/load-config.sh"]
    volumes:
      - ./config/load-config.sh:/scripts/load-config.sh:ro
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - PRODUCT API
  # ============================================
  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_DB: db_product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_product"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - CURRENCY API
  # ============================================
  currency-db:
    image: postgres:17
    container_name: currency-db
    environment:
      POSTGRES_DB: db_currency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    volumes:
      - currency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_currency"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - AUTH API
  # ============================================
  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - ORDER API
  # ============================================
  order-db:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: db_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db_order" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # PRODUCT API
  # ============================================
  product-api:
    build:
      context: ../product-api
    container_name: product-api
    ports:
      - "8000:8000"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
      CLOUDFLARE_R2_ENDPOINT: "https://bc2a529e49754327d5a897ea03c422b6.r2.cloudflarestorage.com"
      CLOUDFLARE_R2_ACCESS_KEY: "93f6a86c0f9e854e6555cd2db89bcf74"
      CLOUDFLARE_R2_SECRET_KEY: "858bb38b11546570c1ca932f286f9e309ec612709f2e62e514ecc2bfd2258548"
      CLOUDFLARE_R2_BUCKET: "product-images"
      CLOUDFLARE_R2_PUBLIC_URL: "https://pub-ae45f3213b4f400cace9a48dcf0e6f3b.r2.dev"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      product-db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # CURRENCY API
  # ============================================
  currency-api:
    build:
      context: ../currency-api
    container_name: currency-api
    ports:
      - "8100:8100"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      currency-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # AUTH API
  # ============================================
  auth-api:
    build:
      context: ../auth-api
    container_name: auth-api
    ports:
      - "8200:8200"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # GATEWAY API
  # ============================================
  gateway-api:
    build:
      context: ../gateway-api
    container_name: gateway-api
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
    networks:
      - backend

  # ============================================
  # ORDER API
  # ============================================
  order-api:
    build:
      context: ../order-api
    container_name: order-api
    ports:
      - "8300:8300"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      product-api:
        condition: service_healthy
      currency-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8300/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # ZIPKIN - DISTRIBUTED TRACING
  # ============================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  # ============================================
  # PROMETHEUS - METRICS COLLECTION
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - backend

  # ============================================
  # LOKI - LOG AGGREGATION
  # ============================================
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    networks:
      - backend

  # ============================================
  # GRAFANA ALLOY - LOG COLLECTION
  # ============================================
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - backend

  # ============================================
  # GRAFANA - OBSERVABILITY DASHBOARD
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - zipkin
    restart: unless-stopped
    networks:
      - backend

# ============================================
# REDE E VOLUMES
# ============================================
networks:
  backend:
    driver: bridge

volumes:
  product_data:
  currency_data:
  auth_data:
  order_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data: