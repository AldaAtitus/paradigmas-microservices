global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-api:8080']

  - job_name: 'auth-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-api:8200']

  - job_name: 'product-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product-api:8000']

  - job_name: 'currency-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['currency-api:8100']

  - job_name: 'order-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-api:8300']